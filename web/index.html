<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Una aldea que vive sola y no se detiene nunca. Sus habitantes los decide Jev." />
    <title>La aldea</title>
    <!-- Iconos y aplicación instalable: los genera web/iconos.py. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/iconos/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/iconos/favicon-16.png" />
    <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#6f8f3e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="La aldea" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Pixelify+Sans:wght@500;600&display=swap" rel="stylesheet" />
    <script>
      // Tema elegido antes de pintar, para que no parpadee.
      try {
        const t = localStorage.getItem("tema");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
